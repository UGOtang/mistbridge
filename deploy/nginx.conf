# MistBridge management console — nginx front door.
# Runs as the unprivileged nginx image user (101) on container port 8080.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 20;
    keepalive_requests 200;
    reset_timedout_connection on;

    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=general:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # Docker embedded DNS: backend can restart without a stale upstream IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $host $backend_url {
        default http://mistbridge-backend:4000;
    }

    map $http_user_agent $bad_bot {
        default 0;
        "" 0;
        ~*(sqlmap|nikto|nmap|masscan|zgrab|nessus|acunetix|dirbuster|gobuster|wfuzz|feroxbuster|wpscan|hydra) 1;
    }
    map $request_uri $bad_uri {
        default 0;
        ~*(\.\./|\.\.%2f|%2e%2e|/etc/passwd|/etc/shadow|/proc/self|id_rsa|/\.git/|/\.env|/wp-admin|/wp-login|/phpmyadmin) 1;
        ~*\.(sql|bak|old|swp|log|ini|conf)$ 1;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        absolute_redirect off;

        limit_conn perip 40;
        limit_req zone=general burst=100 nodelay;

        # Hide any upstream security headers; the edge is the single source of truth.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;

        if ($bad_bot) { return 403; }
        if ($bad_uri) { return 403; }

        location ^~ /internal/ {
            return 404;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Authentication endpoints get a stricter edge rate limit.
        location ^~ /api/auth/ {
            limit_req zone=auth burst=15 nodelay;
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass $backend_url;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Official frp archives, authenticated only by obscurity-free public download.
        location /downloads/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=86400" always;
            access_log off;
        }

        # Vite content-hashed bundles can be cached forever.
        location ~* \.(?:js|css|woff2?|ttf|eot)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* \.(?:png|jpe?g|gif|ico|svg|webp)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* /\. {
            deny all;
            access_log off;
            return 404;
        }

        # React SPA. Unknown paths fall back to index.html.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
    }
}
